[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-station"
version = "0.1.0"
description = "Tiny self-hosted autonomous television/radio station generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0.1",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
tiny-station = "tiny_station.cli:main"

[tool.setuptools.packages.find]
include = ["tiny_station*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
